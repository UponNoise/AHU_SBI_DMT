name: Deploy course index to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source without large course files
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout \
            --branch main "https://github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          git sparse-checkout init --cone
          git sparse-checkout set website
          git checkout --detach "${GITHUB_SHA}"

      - name: Install, build, and upload website artifact
        uses: withastro/action@v6
        with:
          path: source/website
          node-version: 24
          package-manager: pnpm@11.16.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
