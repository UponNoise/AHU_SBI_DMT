            }
            if (!hoverSet.has(topicId)) {
              return;
            }
            $("body").append(hoverHtml);
            var hoverElement = $("#" + hoverId);
            hoverElement.children("div").eq(1).text(unescapeHTML(topicName));
            var maxWidth = hoverElement.parent()[0].getBoundingClientRect().width;
            if (maxWidth && maxWidth > 0) {
                hoverElement.css("max-width", maxWidth);
            }
            var rect = _this[0].getBoundingClientRect();
            var borderWidth = parseInt(hoverElement.find(".selectDivHoverArrow").css("border-width"));
            var top = rect.bottom + borderWidth * 2;
            var hoverOuterWidth = hoverElement.outerWidth(true);
            var left = rect.left + (rect.width - hoverOuterWidth) / 2;
            if (left < 0) {
              left = 0;
              var offset = hoverOuterWidth - (rect.right - rect.width / 2 - borderWidth);
              if (offset < 0) {
                offset = borderWidth * 2;
              }
              hoverElement.find(".selectDivHoverArrow").css("left", offset + "px");
            }
            if (left + hoverOuterWidth > window.innerWidth) {
              left = window.innerWidth - hoverOuterWidth;
              var offset = rect.right - rect.width / 2 - borderWidth - left;
              if (offset > hoverOuterWidth) {
                offset = hoverOuterWidth - borderWidth * 2;
              }
              hoverElement.find(".selectDivHoverArrow").css("left", offset + "px");
            } else {
              hoverElement.find(".selectDivHoverArrow").css("left", (rect.left - left + rect.width / 2 - borderWidth) + "px");
            }
            if (top + hoverElement.outerHeight(true) <= window.innerHeight) {
              hoverElement.css({
                top: top + "px",
                left: left + "px"
              })
            } else {
              hoverElement.find("div").first().removeClass("selectDivHoverArrow");
              hoverElement.find("div").first().addClass("selectDivHoverArrowBottom");
              hoverElement.css({
                bottom: window.innerHeight - rect.top + borderWidth * 2 + "px",
                left: left + "px"
              })
            }
            hoverElement.show();
          }

                    var url = objInfo["wordcloud"].data;
                    showDocumentInfo(type, url);
                }
                return;

            try {

                    var info = brainAiAnalysisCache[i];

                        var url = info.url;

        function request() {
            var objectid = window.frameElement.getAttribute('objectid'),
                    note = Ext.get('note'),
                    hl = Ext.get('hl'),

                    note1 = Ext.get('note1');

                hl.setWidth((percent += 5) + "%");

                return;

            //Ext.get('objectid').setHTML('(文件ID:' + objectid + ')');

            Ext.Ajax.request({
                url: '/ananas/status/' + objectid + '?flag=normal',

                success: function (response) {
                    eval("var data = " + response.responseText);

                    switch (data.status) {
                        case 'success':
                            fileNameStr = data.filename;
                            note1Wrap.remove();
                            if (parent.location.protocol.indexOf("https:") != -1 && data.download.indexOf("http:") != -1) {
                                data.download = data.download.replace("http:", "https:");
                            } else if (parent.location.protocol.indexOf("http:") != -1 && data.download.indexOf("https:") != -1) {
                                data.download = data.download.replace("https:", "http:");

                                Ext.Ajax.request({
                                    url : '/mooc-ans/document/reading-record/get',
                                    method : 'get',
                                    params : {
                                        classId: classId,
                                        knowledgeId: knowledgeId,
                                        originJobId: _jobId,
                                        cpi: personId

                                        initIframe(data, documentPage, objectid)
                                    },
                                    failure : function(){
                                        initIframe(data, "", objectid)
                                    }
                                });
                            }else {
                                initIframe(data, "", objectid)
                            }
                            break;
                        case 'failed':

                            if (timer)
                                clearInterval(timer);

                            note1Wrap.remove();
                            note.show();
                            break;

                        case 'waiting':
                            note1Wrap.update('<div class="line1"><div class="line3"></div></div><p class="tipStyle making">文件正在转码，您无需在此页面等待【9001】</p>');
                            break;
                        case 'converting':
                        case 'transfer':
                            note1Wrap.update('<div class="line1"><div class="line2"></div></div><p class="tipStyle">文件上传中【9002】</p>');
                            break;
                    }

                    Ext.get('loading').hide();

                },
                failure: function (resp) {
                    if (resp.status == 0) {
                        timer && clearInterval(timer);
                        note1Wrap.update('<div class="line1"><div class="line3"></div></div><p class="tipStyle">文件加载超时，请刷新页面重试【9003】</p>');
                        Ext.get('loading').hide();
                    } else {
                        timer && clearInterval(timer);
                        note1Wrap.update('<div class="line1"><div class="line2"></div><p class="tipStyle">文件加载失败，请稍后再试【9004】</p>');
                        Ext.get('loading').hide();
                    }
                }
            });
        }

        function renderOfficeOnline(data) {

                url: url,
